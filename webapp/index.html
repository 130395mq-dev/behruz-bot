<style>
  :root {
    color-scheme: light;
    --page:      #f1f4f3;
    --surface:   #ffffff;
    --ink:       #101613;
    --ink-2:     #57625d;
    --muted:     #93a09a;
    --grid:      #e4e9e7;
    --baseline:  #c9d2ce;
    --ring:      rgba(16,22,19,0.07);
    --teal:      #14a98c;
    --teal-ink:  #0b7d68;
    --hero-a:    #2cc3a2;
    --hero-b:    #12a186;
    --wash:      rgba(16,22,19,0.05);
    --good:      #0c8a0c;
    --bad:       #c43a3a;
    --barber:    #2a78d6;
    --bar:       #eb6834;
    --dress:     #1baf7a;
    --imperium:  #eda100;
    --shadow: 0 1px 2px rgba(16,22,19,.04), 0 8px 24px rgba(16,22,19,.06);
    --nav-h: 76px;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:      #0b0e0d;
      --surface:   #161b19;
      --ink:       #f2f5f4;
      --ink-2:     #b7c2bd;
      --muted:     #7e8a85;
      --grid:      #262d2a;
      --baseline:  #37403c;
      --ring:      rgba(255,255,255,0.08);
      --teal:      #27bd9c;
      --teal-ink:  #35cfae;
      --hero-a:    #1d9c80;
      --hero-b:    #0e7a63;
      --wash:      rgba(255,255,255,0.06);
      --good:      #22b422;
      --bad:       #e05b5b;
      --barber:    #3987e5;
      --bar:       #d95926;
      --dress:     #199e70;
      --imperium:  #c98500;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:      #0b0e0d;
    --surface:   #161b19;
    --ink:       #f2f5f4;
    --ink-2:     #b7c2bd;
    --muted:     #7e8a85;
    --grid:      #262d2a;
    --baseline:  #37403c;
    --ring:      rgba(255,255,255,0.08);
    --teal:      #27bd9c;
    --teal-ink:  #35cfae;
    --hero-a:    #1d9c80;
    --hero-b:    #0e7a63;
    --wash:      rgba(255,255,255,0.06);
    --good:      #22b422;
    --bad:       #e05b5b;
    --barber:    #3987e5;
    --bar:       #d95926;
    --dress:     #199e70;
    --imperium:  #c98500;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.3);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --page:      #f1f4f3;
    --surface:   #ffffff;
    --ink:       #101613;
    --ink-2:     #57625d;
    --muted:     #93a09a;
    --grid:      #e4e9e7;
    --baseline:  #c9d2ce;
    --ring:      rgba(16,22,19,0.07);
    --teal:      #14a98c;
    --teal-ink:  #0b7d68;
    --hero-a:    #2cc3a2;
    --hero-b:    #12a186;
    --wash:      rgba(16,22,19,0.05);
    --good:      #0c8a0c;
    --bad:       #c43a3a;
    --barber:    #2a78d6;
    --bar:       #eb6834;
    --dress:     #1baf7a;
    --imperium:  #eda100;
    --shadow: 0 1px 2px rgba(16,22,19,.04), 0 8px 24px rgba(16,22,19,.06);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 430px; margin: 0 auto; padding: 0 16px calc(var(--nav-h) + 26px); }
  button { font: inherit; color: inherit; }

  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .play .reveal { opacity: 0; animation: rise .55s cubic-bezier(.22,.75,.3,1) forwards; animation-delay: var(--d, 0s); }

  header.top { display: flex; align-items: center; justify-content: space-between; padding: 20px 2px 14px; }
  .hello .hi { font-size: 13px; color: var(--ink-2); }
  .hello .name { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--ring);
    display: grid; place-items: center; color: var(--ink);
    position: relative; box-shadow: var(--shadow);
  }
  .icon-btn .badge {
    position: absolute; top: 9px; right: 10px; width: 8px; height: 8px;
    border-radius: 50%; background: var(--bad); border: 2px solid var(--surface);
  }
  @keyframes ring { 0%,100% { transform: rotate(0); } 12% { transform: rotate(13deg);} 24% { transform: rotate(-11deg);} 36% { transform: rotate(7deg);} 48% { transform: rotate(-4deg);} 58% { transform: rotate(0);} }
  .play .icon-btn svg { animation: ring 1.6s .7s ease-in-out 1; transform-origin: 50% 20%; }

  /* Hero (teal on home, business-colored on biz pages) */
  .hero {
    position: relative; overflow: hidden;
    background: linear-gradient(135deg, var(--ha, var(--hero-a)), var(--hb, var(--hero-b)));
    color: #fff; border-radius: 24px; padding: 20px 20px 18px;
    box-shadow: 0 14px 34px color-mix(in srgb, var(--hb, var(--hero-b)) 32%, transparent);
    margin-bottom: 14px;
  }
  .hero .orb { position: absolute; border-radius: 50%; background: rgba(255,255,255,.10); }
  .hero .orb.o1 { width: 160px; height: 160px; top: -66px; right: -42px; }
  .hero .orb.o2 { width: 84px; height: 84px; bottom: -32px; right: 66px; background: rgba(255,255,255,.07); }
  @keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-8px,6px); } }
  .hero .orb { animation: drift 9s ease-in-out infinite; }
  .hero .h-top { display: flex; align-items: center; gap: 9px; }
  .hero .h-ic { width: 34px; height: 34px; border-radius: 10px; background: rgba(255,255,255,.16); display: grid; place-items: center; }
  .hero .h-label { font-size: 12.5px; font-weight: 650; opacity: .9; }
  .hero .h-value { font-size: 36px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; margin: 8px 0 9px; }
  .hero .h-value .unit { font-size: 16px; font-weight: 600; opacity: .85; letter-spacing: 0; }
  .hero .pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.18); border-radius: 999px; padding: 5px 11px;
    font-size: 11.5px; font-weight: 700;
  }
  .hero .h-row { display: flex; gap: 24px; margin-top: 14px; position: relative; }
  .hero .h-col .k { font-size: 11px; opacity: .8; }
  .hero .h-col .v { font-size: 15.5px; font-weight: 750; font-variant-numeric: tabular-nums; }

  .segments {
    display: grid; grid-template-columns: repeat(3, 1fr);
    background: var(--surface); border: 1px solid var(--ring); border-radius: 14px;
    padding: 4px; gap: 3px; margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .segments button {
    appearance: none; border: 0; background: transparent; color: var(--ink-2);
    font-size: 13px; font-weight: 650; padding: 9px 2px; border-radius: 10px;
    cursor: pointer; transition: background .18s, color .18s, transform .12s;
  }
  .segments button:active { transform: scale(.95); }
  .segments button:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }
  .segments button[aria-pressed="true"] { background: var(--seg, var(--teal)); color: #fff; box-shadow: 0 3px 10px color-mix(in srgb, var(--seg, var(--teal)) 40%, transparent); }
  #tab-barber   { --seg: var(--barber); }
  #tab-bar      { --seg: var(--bar); }
  #tab-dress    { --seg: var(--dress); }
  #tab-imperium { --seg: var(--imperium); }

  .card {
    background: var(--surface); border: 1px solid var(--ring); border-radius: 20px;
    box-shadow: var(--shadow); padding: 17px; margin-bottom: 13px;
  }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 9px; }
  .card-head h2 { font-size: 15.5px; font-weight: 750; margin: 0; letter-spacing: -0.01em; }
  .card-head .sub { font-size: 12px; color: var(--muted); font-weight: 550; }

  .stat-duo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 13px; }
  .stat-tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 18px; box-shadow: var(--shadow); padding: 14px 15px; }
  .stat-tile .k { font-size: 11px; color: var(--muted); font-weight: 650; letter-spacing: .04em; text-transform: uppercase; }
  .stat-tile .v { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .stat-tile .d { font-size: 11.5px; font-weight: 700; margin-top: 2px; color: var(--muted); }
  .stat-tile .d.up { color: var(--good); }

  .op-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
  .op-row + .op-row { border-top: 1px solid var(--grid); }
  .op-icon {
    width: 42px; height: 42px; border-radius: 50%; flex: none;
    border: 1px solid var(--ring); display: grid; place-items: center;
  }
  .op-main { flex: 1; min-width: 0; }
  .op-title { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .op-sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .op-amount { font-size: 13.5px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--teal-ink); }
  .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 14px 0; }

  .live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--teal); margin-right: 5px; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--teal) 45%, transparent); } 60% { box-shadow: 0 0 0 6px transparent; } }
  .live-dot { animation: pulse 2.2s ease-out infinite; }

  .chartbox { position: relative; margin: 2px -2px 0; }
  svg.chart { display: block; }
  svg.chart text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .tooltip {
    position: absolute; pointer-events: none; z-index: 6;
    background: var(--ink); color: var(--page);
    border-radius: 12px; padding: 9px 12px; font-size: 12px; line-height: 1.55;
    box-shadow: 0 8px 24px rgba(0,0,0,.28);
    opacity: 0; transform: translateY(5px) scale(.98); transition: opacity .14s, transform .14s;
    min-width: 130px;
  }
  .tooltip.show { opacity: 1; transform: none; }
  .tooltip .t-date { font-weight: 750; margin-bottom: 3px; }
  .tooltip .t-row { display: flex; justify-content: space-between; gap: 16px; }
  .tooltip .t-row .n { display: flex; align-items: center; gap: 6px; }
  .tooltip .t-row .sw { width: 7px; height: 7px; border-radius: 2px; display: inline-block; }
  .tooltip .t-val { font-variant-numeric: tabular-nums; font-weight: 650; }

  .legend { display: flex; flex-wrap: wrap; gap: 8px 15px; margin-top: 11px; }
  .legend .item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); font-weight: 600; }
  .legend .swatch { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .legend .val { color: var(--ink); font-variant-numeric: tabular-nums; }

  .share-bar { display: flex; height: 15px; border-radius: 8px; overflow: hidden; gap: 2px; margin-top: 4px; transform-origin: left center; }
  .play .share-bar { animation: growx .7s .15s cubic-bezier(.25,.8,.3,1) both; }
  @keyframes growx { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .share-bar span { display: block; min-width: 6px; }

  .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .chip { background: var(--wash); border-radius: 12px; padding: 9px 12px; }
  .chip .ck { font-size: 10.5px; color: var(--muted); font-weight: 650; }
  .chip .cv { font-size: 13.5px; font-weight: 750; font-variant-numeric: tabular-nums; margin-top: 1px; }

  .m-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
  .m-row + .m-row { border-top: 1px solid var(--grid); }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%; flex: none;
    display: grid; place-items: center; font-size: 13px; font-weight: 800; color: #fff;
  }
  .m-main { flex: 1; min-width: 0; }
  .m-name { font-size: 13.5px; font-weight: 720; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-status { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 650; margin-top: 1px; }
  .m-status .sdot { width: 7px; height: 7px; border-radius: 50%; }
  .m-right { text-align: right; }
  .m-sum { font-size: 13.5px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .m-sub { font-size: 11px; color: var(--muted); }
  .m-bar { height: 5px; border-radius: 3px; background: var(--wash); margin-top: 6px; overflow: hidden; }
  .m-bar i { display: block; height: 100%; border-radius: 3px; background: var(--teal); width: 0; transition: width .8s cubic-bezier(.25,.8,.3,1); }

  .date-chip {
    width: 42px; height: 42px; border-radius: 12px; flex: none;
    background: var(--wash); display: grid; place-items: center; text-align: center;
    font-size: 11px; font-weight: 800; line-height: 1.15;
  }
  .date-chip small { display: block; font-size: 9px; font-weight: 650; color: var(--muted); text-transform: uppercase; }

  nav.bottom {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: min(430px, 100%); height: var(--nav-h);
    background: color-mix(in srgb, var(--surface) 90%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--ring);
    display: grid; grid-template-columns: repeat(5, 1fr);
    padding: 8px 6px calc(8px + env(safe-area-inset-bottom, 0px));
    z-index: 20;
  }
  .nav-btn {
    appearance: none; background: none; border: 0; cursor: pointer;
    display: grid; justify-items: center; gap: 3px; color: var(--muted);
    font-size: 10px; font-weight: 650; border-radius: 12px; padding: 6px 0 4px;
    transition: color .18s, transform .12s;
  }
  .nav-btn:active { transform: scale(.93); }
  .nav-btn:focus-visible { outline: 2px solid var(--teal); outline-offset: -2px; }
  .nav-btn[aria-current="true"] { color: var(--c, var(--teal-ink)); }
  .nav-btn .nav-pill { width: 18px; height: 3px; border-radius: 2px; background: transparent; transition: background .18s; }
  .nav-btn[aria-current="true"] .nav-pill { background: var(--c, var(--teal)); }

  .tab { display: none; }
  .tab.active { display: block; }
  .proto-note { text-align: center; font-size: 11.5px; color: var(--muted); margin-top: 14px; line-height: 1.6; }

  @media (prefers-reduced-motion: reduce) {
    *, .play .reveal, .share-bar, .hero .orb { animation: none !important; transition: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>
</head>

</div>

<nav class="bottom" aria-label="Bo'limlar" id="nav"></nav>

      bar:      [1200,900,1450,1700,2600,3400,2900,1100,950,1500,1800,2400,3200,2800,1250,1000,1600,1900,2500,3300,3000,1150,980,1550,1750,2550,3350,2950,1200,1050],
      dress:    [3000,0,1500,4500,0,2800,1500,0,2200,0,0,3500,1800,0,2600,0,1500,0,4200,0,2000,0,0,3100,0,1700,2400,0,0,2900],
      imperium: [0,1200,0,850,2050,0,1200,900,0,1500,0,0,1800,950,0,1100,0,2200,0,1300,0,850,1600,0,0,2000,0,1150,900,0]

  const PERIOD_DAYS = { today: 1, week: 7, month: 30 };

  // ── Format ──
  const fmtMln = (t) => {
    const m = t / 1000;
    return (m >= 10 ? m.toFixed(1) : m.toFixed(2)).replace(/0+$/, "").replace(/\.$/, "").replace(".", ",");
  };
  const fmtSum = (t) => t >= 1000
    ? fmtMln(t) + " mln"
    : String(Math.round(t)).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " ming";

  function roundedTopRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h);
    return `M${x},${y + h} L${x},${y + r} Q${x},${y} ${x + r},${y} L${x + w - r},${y} Q${x + w},${y} ${x + w},${y + r} L${x + w},${y + h} Z`;
  }

  function countUp(node, target, fmt, dur = 700) {
    if (reduceMotion) { node.textContent = fmt(target); return; }
    const t0 = performance.now();
    (function tick(t) {
      const p = Math.min((t - t0) / dur, 1);
      const e = 1 - Math.pow(1 - p, 3);
      node.textContent = fmt(target * e);
      if (p < 1) requestAnimationFrame(tick);
    })(t0);
  }

  (function greet() {
    const h = new Date().getHours();
    el("greet").textContent = h < 12 ? "Xayrli tong," : h < 18 ? "Xayrli kun," : "Xayrli kech,";

  // ── Grafikalar ──
  function stackedBars(container, d, keys, tooltipTitle) {
    const n = d.labels.length;
    const W = 396, H = 185, PB = 22, PT = 8;
    const dayTotals = d.labels.map((_, i) => sum(keys.map(k => d.series[k][i])));
    const max = Math.max(...dayTotals) * 1.05 || 1;
    const gap = n > 12 ? 3 : 11;
    const bw = (W - gap * (n - 1)) / n;
    const plotH = H - PB - PT;
    const y = (v) => PT + plotH - (v / max) * plotH;
    const baseY = PT + plotH;

    let grid = "";
    for (let g = 1; g <= 3; g++) {
      const gy = PT + (plotH * g) / 4;
      grid += `<line x1="0" y1="${gy.toFixed(1)}" x2="${W}" y2="${gy.toFixed(1)}" stroke="${cssVar("--grid")}" stroke-width="1"/>`;
    }

    let bars = "", labels = "", hits = "";
    for (let i = 0; i < n; i++) {
      const x = i * (bw + gap);
      let acc = 0, colBars = "";
      const segs = keys.map(k => ({ k, v: d.series[k][i] })).filter(s => s.v > 0);
      segs.forEach((s, si) => {
        const y1 = y(acc + s.v), y0 = y(acc);
        const h = Math.max(y0 - y1 - (si < segs.length - 1 ? 2 : 0), 1.5);
        const isTop = si === segs.length - 1;
        const color = cssVar("--" + s.k);
        colBars += isTop
          ? `<path d="${roundedTopRect(x, y1, bw, h, Math.min(4, bw / 2))}" fill="${color}"/>`
          : `<rect x="${x}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${color}"/>`;
        acc += s.v;
      });
      const delay = (i / n) * 0.25;
      bars += `<g class="col" style="transform-origin:0 ${baseY}px;${reduceMotion ? "" : `transform:scaleY(0);transition:transform .6s ${delay.toFixed(2)}s cubic-bezier(.25,.8,.3,1)`}">${colBars}</g>`;
      hits += `<rect class="hit" data-i="${i}" x="${x - gap / 2}" y="0" width="${bw + gap}" height="${baseY}" fill="transparent"/>`;
      if (n <= 12 || i % 5 === 0 || i === n - 1) {
        labels += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="${cssVar("--muted")}">${d.labels[i]}</text>`;
      }
    }

    container.innerHTML =
      `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${tooltipTitle}">
        ${grid}<line x1="0" y1="${baseY.toFixed(1)}" x2="${W}" y2="${baseY.toFixed(1)}" stroke="${cssVar("--baseline")}" stroke-width="1"/>
        ${bars}${labels}${hits}
      </svg><div class="tooltip"></div>`;

    if (!reduceMotion) requestAnimationFrame(() => requestAnimationFrame(() => {
      container.querySelectorAll("g.col").forEach(g => { g.style.transform = "scaleY(1)"; });
    }));

    const svg = container.querySelector("svg"), tip = container.querySelector(".tooltip");
    function showTip(i, clientX) {
      const rows = keys.map(k => ({ k, v: d.series[k][i] })).filter(r => r.v > 0);
      if (!rows.length) { tip.classList.remove("show"); return; }
      tip.innerHTML = `<div class="t-date">${d.labels[i]}</div>` + rows.map(r => {
        const b = bizByKey(r.k);
        return `<div class="t-row"><span class="n"><span class="sw" style="background:${cssVar("--" + r.k)}"></span>${b ? b.name : r.k}</span><span class="t-val">${fmtSum(r.v)}</span></div>`;
      }).join("") + (rows.length > 1
        ? `<div class="t-row" style="margin-top:3px"><span class="n">Jami</span><span class="t-val">${fmtSum(sum(rows.map(r => r.v)))}</span></div>` : "");
      const wr = container.getBoundingClientRect();
      tip.classList.add("show");
      const tw = tip.offsetWidth;
      let lx = clientX - wr.left - tw / 2;
      lx = Math.max(4, Math.min(lx, wr.width - tw - 4));
      tip.style.left = lx + "px"; tip.style.top = "-8px";
    }
    svg.addEventListener("pointermove", (e) => {
      const t = e.target.closest(".hit");
      if (t) showTip(+t.dataset.i, e.clientX); else tip.classList.remove("show");
    });
    svg.addEventListener("pointerleave", () => tip.classList.remove("show"));
  }

  // ── Sahifalarni to'ldirish ──
  function renderHome(period) {
    const d = DATA[period];
    const totals = BIZ.map(b => ({ ...b, total: sum(d.series[b.key]) }));
    const grand = sum(totals.map(t => t.total));
    const dayTotals = d.labels.map((_, i) => sum(BIZ.map(b => d.series[b.key][i])));
    const deltaPct = d.prevTotal > 0 ? Math.round((grand - d.prevTotal) / d.prevTotal * 100) : 0;

    el("hero-label").textContent = "Umumiy tushum · " + d.label;
    countUp(el("hero-num"), grand, fmtMln);
    el("hero-pill").innerHTML = (deltaPct >= 0 ? "▲ +" : "▼ ") + deltaPct + "% o'tgan davrga nisbatan";
    el("hero-row").innerHTML = `
      <div class="h-col"><div class="k">O'rtacha kunlik</div><div class="v">${fmtSum(grand / Math.max(d.labels.length, 1))}</div></div>

      <div class="h-col"><div class="k">Eng yaxshi kun</div><div class="v">${fmtSum(Math.max(...dayTotals))}</div></div>`;

    el("share-sub").textContent = d.label;

      `<span class="item"><span class="swatch" style="background:var(${t.varName})"></span>${t.name} <span class="val">${fmtSum(t.total)}</span></span>`).join("");

    el("home-ops").innerHTML = d.ops.length ? d.ops.map(opRow).join("") : `<div class="empty">Hozircha amallar yo'q</div>`;

  const STATUS = {

  function salesListCard(title, items, emptyText, delayS) {
    const rows = items.length ? items.map(s => `

    return `<div class="card reveal" style="--d:${delayS}s">
      <div class="card-head"><h2>${title}</h2></div>${rows}</div>`;
  }

              <div class="m-main"><div class="m-name">${bk.client}</div><div class="m-sub">Zalog: ${fmtSum(bk.deposit)} · Qoldiq: ${fmtSum(rem)}</div></div>

      } else {

          <div class="h-col"><div class="k">O'rtacha chek</div><div class="v">${fmtSum(avg)}</div></div>
          <div class="h-col"><div class="k">Eng katta</div><div class="v">${fmtSum(Math.max(...vals, 0))}</div></div>`;

      el("bpill-" + b.key).innerHTML = pill;

      requestAnimationFrame(() => requestAnimationFrame(() => {
        el("bextra-" + b.key).querySelectorAll(".m-bar i").forEach(x => { x.style.width = x.dataset.w + "%"; });
      }));
    });
  }

  // ── Holat ──
  let currentPeriod = "week";
  let currentTab = "home";
  const appEl = el("app");

  function syncSegments() {
    document.querySelectorAll(".segments button").forEach(b =>
      b.setAttribute("aria-pressed", b.dataset.period === currentPeriod ? "true" : "false"));
  }
  function render() {
    renderHome(currentPeriod);
    renderBiz(currentPeriod);
    syncSegments();
    el("live-label").textContent = isLive ? "jonli" : "namuna";
    el("note").innerHTML = (isLive
      ? "Ma'lumotlar bot bazasidan jonli olinmoqda."
      : "Namunaviy ma'lumotlar — server bilan aloqa yo'q." + (lastErr ? " (xato: " + lastErr + ")" : "")) + " · v4";
  }
  function replay() {
    appEl.classList.remove("play");
    void appEl.offsetWidth;
    appEl.classList.add("play");
  }
  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll(".tab").forEach(s => s.classList.remove("active"));
    el("tab-" + tab).classList.add("active");
    document.querySelectorAll(".nav-btn").forEach(b =>
      b.setAttribute("aria-current", b.dataset.tab === tab ? "true" : "false"));
    scrollTo({ top: 0 });
    replay();
    render();
  }

  document.addEventListener("click", (e) => {
    const nav = e.target.closest(".nav-btn");
    if (nav) { switchTab(nav.dataset.tab); return; }
    const seg = e.target.closest(".segments button");
    if (seg) { currentPeriod = seg.dataset.period; loadData().then(render); syncSegments(); }
  });

  // ── Server bilan aloqa ──
  const getTg = () => (window.Telegram && window.Telegram.WebApp) || null;
  function getInitData() {
    // 1) Rasmiy SDK orqali
    const tg = getTg();
    if (tg && tg.initData) return tg.initData;
    // 2) Telegram sahifani ochganda beradigan hash parametridan (SDK yuklanmasa ham ishlaydi)
    const m = (location.hash || "").match(/tgWebAppData=([^&]+)/);
    if (m) {
      const raw = decodeURIComponent(m[1]);
      try { sessionStorage.setItem("tg_init_data", raw); } catch (e) {}
      return raw;
    }
    // 3) Avval saqlab qo'yilgan nusxa (sahifa qayta yuklanganda hash yo'qolishi mumkin)
    try { return sessionStorage.getItem("tg_init_data") || ""; } catch (e) { return ""; }
  }
  function apiToData(json) {
    // API javobini frontend formatiga o'girish (boshqa davrlar o'z holicha qoladi)
    const out = { ...DATA };
    const periodKey = currentPeriod;
    out[periodKey] = {
      label: json.label,
      labels: json.labels,
      series: json.series,
      prevTotal: json.prev_total,
      opsCount: json.ops_count,
      amoriaSplit: json.amoria_split,
      masters: json.masters,
      bookings: json.bookings,
      dressSales: json.dress_sales,
      imperiumSales: json.imperium_sales,
      ops: json.ops
    };
    return out;
  }
  async function loadData() {
    try {
      const days = PERIOD_DAYS[currentPeriod];
      const res = await fetch(`/api/dashboard?days=${days}`, {
        headers: { "X-Telegram-Init-Data": getInitData() }
      });
      if (!res.ok) {
        let detail = "";
        try { detail = (await res.json()).detail || ""; } catch (e) {}
        throw new Error(res.status + (detail ? " — " + detail : ""));
      }
      const json = await res.json();
      DATA = apiToData(json);
      isLive = true;
      el("live-badge").hidden = true;
      if (json.owner_name) el("owner-name").textContent = json.owner_name;
    } catch (err) {
      isLive = false;
      lastErr = String(err && err.message || err);
      el("live-badge").hidden = false;
    }
  }
  let lastErr = "";

  el("refresh-btn").addEventListener("click", () => loadData().then(() => { replay(); render(); }));

  // ── Boshlash ──
  getInitData(); // hash'dagi ma'lumotni darhol saqlab olamiz
  const tg0 = getTg();
  if (tg0) { try { tg0.ready(); tg0.expand(); } catch (e) {} }
  buildTabs();
  render();
  appEl.classList.add("play");
  loadData().then(render);
  // Telegram skripti kechikib yuklansa — qayta urinamiz
  addEventListener("load", () => { if (!isLive) loadData().then(render); });

  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
  new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
})();
</script>
</body>
</html>
